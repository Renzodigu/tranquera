name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,app,claude]"
      - name: Lint
        run: ruff check src tests app
      - name: Test
        run: pytest -q
      - name: Demo report and accuracy gate
        run: tranquera evaluate --out demo-report --min-accuracy 85
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.13'
        with:
          name: demo-report
          path: demo-report/
