# ISO/IEC 27001:2022 — Annex A control catalog (identifiers only).
#
# The text of ISO/IEC 27001 is copyrighted by ISO/IEC. This file does NOT reproduce it:
# it contains the public control identifiers plus short titles and guidance written by
# the Tranquera authors in their own words. Use the official standard for the real text.
#
# Fields
#   id           Annex A identifier
#   theme        organizational | people | physical | technological
#   en / es      short title, own wording
#   crit         criticality used for severity scoring: high | medium | low
#   kw           retrieval keywords (Spanish + English, accents not required)
#   nist         indicative mapping to NIST CSF 2.0 subcategories (author's analysis,
#                not the official NIST informative reference; see docs/mapping.md)
framework: iso27001-2022
name: ISO/IEC 27001:2022 Annex A
controls:
  # --- 5. Organizational controls -------------------------------------------------
  - {id: "5.1", theme: organizational, crit: high, en: "Security policies", es: "Políticas de seguridad", kw: [politica de seguridad, aprobada por la direccion, revision anual, information security policy], nist: [GV.PO-01, GV.PO-02]}
  - {id: "5.2", theme: organizational, crit: medium, en: "Security roles and responsibilities", es: "Roles y responsabilidades de seguridad", kw: [roles, responsabilidades, CISO, responsable de seguridad, comite de seguridad], nist: [GV.RR-02]}
  - {id: "5.3", theme: organizational, crit: medium, en: "Separation of conflicting duties", es: "Separación de funciones incompatibles", kw: [segregacion de funciones, separacion de funciones, cuatro ojos, doble aprobacion], nist: [PR.AA-05]}
  - {id: "5.4", theme: organizational, crit: medium, en: "Management commitment to security", es: "Compromiso de la dirección", kw: [direccion, directorio, compromiso, alta gerencia], nist: [GV.RR-01]}
  - {id: "5.5", theme: organizational, crit: low, en: "Contact with authorities", es: "Contacto con autoridades", kw: [autoridades, BCRA, AAIP, regulador, notificacion a autoridades], nist: [GV.OC-03, RS.CO-02]}
  - {id: "5.6", theme: organizational, crit: low, en: "Contact with special interest groups", es: "Contacto con grupos de interés", kw: [grupos de interes, foros, CSIRT, comunidad de seguridad], nist: [ID.RA-02]}
  - {id: "5.7", theme: organizational, crit: medium, en: "Threat intelligence", es: "Inteligencia de amenazas", kw: [inteligencia de amenazas, threat intelligence, indicadores de compromiso, IOC, fuentes de amenazas], nist: [ID.RA-02, ID.RA-03]}
  - {id: "5.8", theme: organizational, crit: medium, en: "Security in project management", es: "Seguridad en la gestión de proyectos", kw: [proyectos, gestion de proyectos, requisitos de seguridad del proyecto], nist: [ID.RA-07]}
  - {id: "5.9", theme: organizational, crit: high, en: "Inventory of assets", es: "Inventario de activos", kw: [inventario de activos, activos, propietario del activo, CMDB], nist: [ID.AM-01, ID.AM-02, ID.AM-05]}
  - {id: "5.10", theme: organizational, crit: medium, en: "Acceptable use of assets", es: "Uso aceptable de activos", kw: [uso aceptable, uso de equipos, uso permitido], nist: [GV.PO-01]}
  - {id: "5.11", theme: organizational, crit: medium, en: "Return of assets", es: "Devolución de activos", kw: [devolucion de activos, desvinculacion, entrega de equipos, offboarding], nist: [ID.AM-08]}
