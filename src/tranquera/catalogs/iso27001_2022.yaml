  - {id: "5.34", theme: organizational, crit: high, en: "Privacy and protection of personal data", es: "Privacidad y datos personales", kw: [datos personales, privacidad, ley 25.326, titular de los datos, AAIP], nist: [GV.OC-03, PR.DS-01]}
