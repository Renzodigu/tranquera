  - {id: "5.36", theme: organizational, crit: medium, en: "Compliance with policies and standards", es: "Cumplimiento de políticas y normas", kw: [cumplimiento de politicas, verificacion de cumplimiento, excepciones], nist: [ID.IM-02]}
  - {id: "5.37", theme: organizational, crit: low, en: "Documented operating procedures", es: "Procedimientos operativos documentados", kw: [procedimiento, procedimientos operativos, runbook, instructivo], nist: [GV.PO-01]}
