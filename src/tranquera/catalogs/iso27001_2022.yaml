  - {id: "5.13", theme: organizational, crit: low, en: "Labelling of information", es: "Etiquetado de la información", kw: [etiquetado, etiqueta, marcado de documentos], nist: [ID.AM-07]}
  - {id: "5.14", theme: organizational, crit: medium, en: "Information transfer", es: "Transferencia de información", kw: [transferencia, intercambio de informacion, envio de datos, SFTP, correo cifrado], nist: [PR.DS-02]}
  - {id: "5.15", theme: organizational, crit: high, en: "Access control", es: "Control de acceso", kw: [control de acceso, minimo privilegio, necesidad de saber, access control], nist: [PR.AA-05]}
  - {id: "5.16", theme: organizational, crit: high, en: "Identity management", es: "Gestión de identidades", kw: [identidades, alta de usuarios, baja de usuarios, cuentas compartidas, identificador unico], nist: [PR.AA-01]}
  - {id: "5.17", theme: organizational, crit: high, en: "Authentication information", es: "Información de autenticación", kw: [contrasena, clave, credenciales, gestor de contrasenas, password], nist: [PR.AA-01, PR.AA-03]}
  - {id: "5.18", theme: organizational, crit: high, en: "Access rights", es: "Derechos de acceso", kw: [revision de accesos, derechos de acceso, recertificacion, permisos, access review], nist: [PR.AA-05]}
  - {id: "5.19", theme: organizational, crit: high, en: "Security in supplier relationships", es: "Seguridad con proveedores", kw: [proveedores, terceros, evaluacion de proveedores, riesgo de terceros], nist: [GV.SC-01, GV.SC-06]}
  - {id: "5.20", theme: organizational, crit: medium, en: "Security in supplier agreements", es: "Seguridad en contratos con proveedores", kw: [contrato, clausulas de seguridad, acuerdo de nivel de servicio, SLA, acuerdo de confidencialidad con proveedores], nist: [GV.SC-05]}
  - {id: "5.21", theme: organizational, crit: medium, en: "ICT supply chain security", es: "Seguridad en la cadena de suministro TIC", kw: [cadena de suministro, dependencias, componentes de terceros, software de terceros], nist: [GV.SC-05, GV.SC-07]}
