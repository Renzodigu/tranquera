  - {id: "5.23", theme: organizational, crit: high, en: "Security for cloud services", es: "Seguridad en servicios en la nube", kw: [nube, cloud, AWS, proveedor de nube, responsabilidad compartida], nist: [GV.SC-05, GV.SC-07]}
  - {id: "5.24", theme: organizational, crit: high, en: "Incident management planning", es: "Planificación de la gestión de incidentes", kw: [incidente, plan de respuesta, gestion de incidentes, roles en incidentes], nist: [RS.MA-01]}
  - {id: "5.25", theme: organizational, crit: medium, en: "Assessment of security events", es: "Evaluación de eventos de seguridad", kw: [evento de seguridad, triage, clasificacion de incidentes, severidad], nist: [DE.AE-02, DE.AE-08]}
  - {id: "5.26", theme: organizational, crit: high, en: "Response to incidents", es: "Respuesta a incidentes", kw: [respuesta a incidentes, contencion, erradicacion, escalamiento], nist: [RS.MA-01, RS.MI-01, RS.MI-02]}
  - {id: "5.27", theme: organizational, crit: medium, en: "Learning from incidents", es: "Aprendizaje de incidentes", kw: [lecciones aprendidas, post mortem, causa raiz, mejora], nist: [ID.IM-02, ID.IM-03]}
  - {id: "5.28", theme: organizational, crit: medium, en: "Collection of evidence", es: "Recolección de evidencia", kw: [evidencia forense, cadena de custodia, preservacion de evidencia], nist: [RS.AN-07]}
  - {id: "5.29", theme: organizational, crit: high, en: "Security during disruption", es: "Seguridad durante interrupciones", kw: [continuidad del negocio, interrupcion, contingencia, crisis], nist: [ID.IM-04, RC.RP-01]}
  - {id: "5.30", theme: organizational, crit: high, en: "ICT readiness for business continuity", es: "Preparación TIC para la continuidad", kw: [continuidad, RTO, RPO, recuperacion ante desastres, DRP, plan de continuidad], nist: [ID.IM-04, PR.IR-03, RC.RP-01]}
